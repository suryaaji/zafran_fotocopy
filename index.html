<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fotocopy Zafran - Sistem Kelola Barang & Kasir</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #f1f5f9;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>

<body>
  <!-- 
    GANTI URL DI BAWAH INI DENGAN URL HASIL DEPLOY APPS SCRIPT ANDA 
    (Contoh: https://script.google.com/macros/s/AKfycb.../exec)
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbz7dsViSXLWp4M1XEwWatryQh2GotlWwu128QKCdjzRkXOw0BElrQjgU0Hnpg4JuO1mtA/exec"
    allow="clipboard-read; clipboard-write"></iframe>
</body>

</html>
